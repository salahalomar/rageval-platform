# Local stack. Compose project name is set explicitly because the containing directory
# name is not guaranteed to be a valid project name on every machine.
name: rag-eval-platform

services:
  postgres:
    # Pinned to an exact pgvector release, not :pg16. ENGINEERING.md calls for
    # determinism in the eval path, and an index built by a different pgvector version
    # is a different experiment. Ships pgvector 0.8.6 on PostgreSQL 16.15; the HNSW
    # parameters used in Phase 2 are unchanged across 0.7 and 0.8.
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Inside the network the host is `postgres`, not localhost — this deliberately
      # overrides whatever DATABASE_URL is in .env, which points at the published port
      # for host-side tooling (make migrate, pytest).
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source is bind-mounted so --reload picks up edits without a rebuild. The venv
      # lives at /app/.venv and is deliberately not shadowed.
      - ./packages:/app/packages
      - ./apps:/app/apps
    command:
      - uvicorn
      - api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/apps
      - --reload-dir
      - /app/packages
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Opt-in: `docker compose --profile web up web`. Left out of the default stack on
  # purpose. Vite runs perfectly well on the host, and a Node image for something that
  # needs no container is half a gigabyte of disk bought for nothing. `make web` is the
  # path this repository actually recommends; this service exists for a machine with no
  # Node installed.
  web:
    profiles: ["web"]
    image: node:22-alpine
    working_dir: /app/apps/web
    environment:
      # Inside the network the API is reachable by service name, not on localhost.
      VITE_API_TARGET: http://api:8000
      WEB_PORT: "5173"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run dev"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
