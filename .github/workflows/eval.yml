name: eval

# The full ablation, nightly. Separate from ci.yml because it is slow -- the
# cross-encoder alone is roughly five seconds per question on CPU -- and because the
# judged arms cost money, which no pull request should ever trigger.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      judge:
        description: "Also run the paid LLM judge (costs money)"
        type: boolean
        default: false

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  ablate:
    name: full ablation
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.12"
          enable-cache: true

      - run: uv python install
      - run: uv sync --frozen
      - run: make migrate

      # Model weights are ~1.2GB across the embedder and the cross-encoder. Downloading
      # them on every nightly run wastes several minutes and a good deal of somebody
      # else's bandwidth.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('uv.lock') }}

      # The corpus is pinned by id, so this rebuilds the exact same one. It is slow --
      # arXiv asks for one request every three seconds -- which is why this job is
      # nightly rather than per-push.
      - name: Cache the ingested corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: data/pdfs
          key: corpus-${{ hashFiles('infra/corpus/*.txt') }}

      - name: Ingest and embed
        run: |
          uv run rag ingest --ids-file infra/corpus/cs-lg-cs-cl-150.txt
          uv run rag embed

      - name: Run the ablation
        run: uv run python -m eval.ablate

      - name: Regenerate the README table
        run: uv run python -m eval.report --inject

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/results README.md
          git diff --staged --quiet || git commit -m "eval: nightly ablation results"
          git push
